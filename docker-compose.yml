services:
  # PHP-FPM Application Container (Laravel 13 on PHP 8.4/8.5)
  app:
    build:
      context: .
      dockerfile: Dockerfile
    image: qlon-pos-app:latest
    restart: unless-stopped
    volumes:
      - ./.env:/var/www/.env:z
      - ./public:/var/www/public
      - appstorage:/var/www/storage
    depends_on:
      db:
        condition: service_healthy
    environment:
      - APP_ENV=${APP_ENV:-production}
      - APP_DEBUG=${APP_DEBUG:-false}
      - DB_CONNECTION=${DB_CONNECTION:-pgsql}
      - DB_HOST=db
      - DB_PORT=5432
      - DB_DATABASE=${DB_DATABASE:-pos_saas_db}
      - DB_USERNAME=${DB_USERNAME:-pos_user}
      - DB_PASSWORD=${DB_PASSWORD:-pos_password_secure}
      - REDIS_HOST=redis
      - REDIS_PORT=6379
      - SESSION_DRIVER=database
      - CACHE_STORE=database
      - QUEUE_CONNECTION=database
    networks:
      - pos-network

  # Nginx Reverse Web Server Container
  web:
    build:
      context: .
      dockerfile: docker/nginx/Dockerfile
    image: qlon-pos-web:latest
    restart: unless-stopped
    ports:
      - "${APP_PORT:-8085}:80"
    volumes:
      - ./public:/var/www/public:ro
      - appstorage:/var/www/storage:ro
    depends_on:
      - app
    networks:
      - pos-network

  # PostgreSQL 16 Database Container
  db:
    image: postgres:16-alpine
    restart: unless-stopped
    ports:
      - "${DB_PORT:-5432}:5432"
    environment:
      POSTGRES_DB: ${DB_DATABASE:-pos_saas_db}
      POSTGRES_USER: ${DB_USERNAME:-pos_user}
      POSTGRES_PASSWORD: ${DB_PASSWORD:-pos_password_secure}
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USERNAME:-pos_user} -d ${DB_DATABASE:-pos_saas_db}"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s
    networks:
      - pos-network

  # Redis In-Memory Cache & Queue
  redis:
    image: redis:alpine
    restart: unless-stopped
    volumes:
      - redisdata:/data
    networks:
      - pos-network

networks:
  pos-network:
    driver: bridge

volumes:
  pgdata:
    driver: local
  redisdata:
    driver: local
  appstorage:
    driver: local
